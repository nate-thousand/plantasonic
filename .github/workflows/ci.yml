name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: plantasonic
      - uses: actions/checkout@v5
        with:
          repository: nate-thousand/plantasonic-platform
          path: plantasonic-platform
      - uses: actions/checkout@v5
        with:
          repository: nate-thousand/ascii-visual-engine
          ref: v0.1.0
          path: ascii-visual-engine
      - uses: actions/checkout@v5
        with:
          repository: nate-thousand/plantasonic-design-system
          path: plantasonic-design-system
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plantasonic/package-lock.json
      - name: Build platform packages
        working-directory: plantasonic-platform
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build ASCII Visual Engine
        working-directory: ascii-visual-engine
        run: npm ci && npm run build
      - name: Install Plantasonic dependencies
        working-directory: plantasonic
        run: npm ci
      - name: Validate application architecture
        working-directory: plantasonic
        run: npm run validate:app
      - name: Lint
        working-directory: plantasonic
        run: npm run lint
      - name: Typecheck
        working-directory: plantasonic
        run: npm run typecheck
      - name: Build
        working-directory: plantasonic
        run: npm run build

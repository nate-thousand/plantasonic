name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: plantasonic

      - uses: actions/checkout@v4
        with:
          repository: nate-thousand/ascii-visual-engine
          ref: v0.1.0
          path: ascii-visual-engine

      - uses: actions/checkout@v4
        with:
          repository: nate-thousand/plantasonic-design-system
          path: plantasonic-design-system

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plantasonic/package-lock.json

      - name: Build ASCII Visual Engine
        working-directory: ascii-visual-engine
        run: npm ci && npm run build

      - name: Install Plantasonic dependencies
        working-directory: plantasonic
        run: npm ci

      - name: Lint
        working-directory: plantasonic
        run: npm run lint

      - name: Format check
        working-directory: plantasonic
        run: npm run format:check

      - name: Verify integration
        working-directory: plantasonic
        run: npm run verify:integration

      - name: Build
        working-directory: plantasonic
        run: npm run build
